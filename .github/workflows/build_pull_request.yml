name: PR build check
on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!i18n/src/commonMain/moko-resources/**/strings-aniyomi.xml'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals-aniyomi.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings-aniyomi.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals-aniyomi.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build app
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Dependency graph / GHAS is not enabled on this repository, so this step
      # must not block the actual build.
      - name: Dependency Review
        continue-on-error: true
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Check code format
        run: ./gradlew spotlessCheck 2>&1 | tee spotless.log

      - name: Build app
        run: |
          ./gradlew :app:assembleRelease :app:assemblePreview --console=plain 2>&1 | tee build.log
          echo "=== outputs after build (same step) ===" | tee outputs.log
          find app/build/outputs -type f 2>/dev/null | sort | tee -a outputs.log
          test -n "$(find app/build/outputs -name '*.apk' -print -quit 2>/dev/null)" || { echo "NO APK PRODUCED"; exit 1; }

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest 2>&1 | tee test.log

      - name: List build outputs
        if: always()
        run: find . -path ./node_modules -prune -o -type f -name '*.apk' -print 2>/dev/null | sort | tee -a outputs.log; ls app/build/outputs/apk 2>/dev/null || echo 'no app/build/outputs/apk'

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mihono-apk-${{ github.sha }}
          if-no-files-found: error
          path: app/build/outputs/apk/preview/app-arm64-v8a-preview.apk

      - name: Report APK sizes on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/preview/app-arm64-v8a-preview.apk
          REL=app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
          {
            echo "### APK size report @ ${{ github.sha }}"
            echo
            echo '```'
            ls -la app/build/outputs/apk/preview/ app/build/outputs/apk/release/ 2>/dev/null
            for f in "$APK" "$REL"; do
              [ -f "$f" ] && echo "$f: $(du -h "$f" | cut -f1) ($(stat -c%s "$f") bytes)"
            done
            echo '--- largest entries in arm64 preview APK ---'
            [ -f "$APK" ] && unzip -l "$APK" | sort -k1 -nr | head -n 25
            echo '--- native libs by ABI (preview) ---'
            [ -f "$APK" ] && unzip -l "$APK" | grep -E "lib/.*\.so" | awk '{s[$2]+=$1} END {for (k in s) print k, s[k]}' | sort -k2 -nr | head
            echo '```'
          } > size-report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file size-report.md || true

      - name: Upload mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release

      # Build logs cannot be downloaded from every environment, so surface the
      # relevant errors directly on the PR for diagnosis.
      - name: Report failure on PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI failure @ ${{ github.sha }}"
            echo
            echo '**APK outputs found:**'
            echo '```'
            cat outputs.log
            echo '```'
            echo '```'
            grep -hE "e: |error:|FAILED|What went wrong|Execution failed|\.kts?:[0-9]+:[0-9]+" spotless.log build.log test.log outputs.log 2>/dev/null | head -n 120
            echo '```'
            echo
            echo '```'
            tail -n 120 spotless.log build.log test.log outputs.log 2>/dev/null | tail -n 120
            echo '```'
          } > report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file report.md || true

